# warframe-tracker configuration: every default, with its explanation.
# Nothing is hardcoded in the code — every path, URL and threshold lives here.
#
# Do not edit this file. Your own file, ~/.config/warframe-tracker/config.toml,
# is laid over it and needs only the keys that differ - same sections, same
# names. A table is merged key by key; a list (like `manifests`) is replaced
# as a whole. Saving a setting in the app creates that file for you.

[paths]
# Where downloaded manifests and the built database go.
# Empty -> $XDG_DATA_HOME/warframe-tracker (usually ~/.local/share/warframe-tracker)
data_dir = ""

# Warframe's own log file. The game writes it on every start; it tells us which
# relics are in play and when the reward screen opens.
# Steam/Proton default shown below; the app id 230410 is Warframe's.
# Flatpak Steam keeps it under
#   ~/.var/app/com.valvesoftware.Steam/.local/share/Steam/steamapps/compatdata/230410/...
# and another Steam library under <library>/steamapps/compatdata/230410/...
ee_log = "~/.local/share/Steam/steamapps/compatdata/230410/pfx/drive_c/users/steamuser/AppData/Local/Warframe/EE.log"

# Where the Setup page looks for that log when ee_log above does not exist: the
# Steam folders (each also lists its other libraries in
# steamapps/libraryfolders.vdf) and the log's place inside a library. Standard
# Steam, then the Flatpak's own folder. Only local files are read.
steam_roots = [
    "~/.local/share/Steam",
    "~/.steam/steam",
    "~/.var/app/com.valvesoftware.Steam/.local/share/Steam",
]
ee_log_in_library = "steamapps/compatdata/230410/pfx/drive_c/users/steamuser/AppData/Local/Warframe/EE.log"

[sources]
# Digital Extremes' Public Export. The index lists one manifest per line as
# "filename!hash"; the hash changes whenever the game data changes, which is
# how we avoid re-downloading unchanged files.
index_url = "https://origin.warframe.com/PublicExport/index_en.txt.lzma"
manifest_base = "https://content.warframe.com/PublicExport/Manifest/"

# Which manifests we actually need. Adding one here is enough — the loader
# derives everything else from the index.
manifests = [
    "ExportWarframes_en.json",
    "ExportWeapons_en.json",
    "ExportResources_en.json",
    "ExportRecipes_en.json",
    "ExportRelicArcane_en.json",
    "ExportSentinels_en.json",
    # Everything below is loaded to be recognised and then dismissed. An
    # inventory screen is mostly things this tool has no opinion about, and a
    # tile with no right answer in the list goes to the nearest wrong one:
    # "Gravimag Blueprint" matched Gram Blueprint at 87. No threshold separates
    # that from a correct reading, because correct readings score lower all the
    # time. Naming the decoy is what settles it — it then matches itself at 100.
    #
    # Cosmetics: "Yareli Prime Helmet" is a skin, and without knowing that it
    # matches "Yareli Prime" and counts as a built Warframe.
    "ExportCustoms_en.json",
    # Gear (ciphers, specters, scanners), mods, keys and fusion bundles.
    "ExportGear_en.json",
    "ExportUpgrades_en.json",
    "ExportKeys_en.json",
    "ExportFusionBundles_en.json",
    "ExportDrones_en.json",
]

# Vaulted status: Digital Extremes' official drop tables, one HTML page with
# every mission, bounty and enemy reward table plus the contents of every
# relic. A relic that some reward table drops is available; every other relic
# is vaulted. The page is kept as droptables.html in the data directory, where
# other tools can read the same download (`wf droptables` refreshes only this).
#
# Do not go back to WFCD's Relics.json for this: its `vaulted` flag is itself
# "no drop location known", computed from locations several builds behind DE
# - two days after Update 44 it had all five new Citrine relics vaulted.
# The URL is the one DE's patch notes link to (Update 44, 2026-09-23); it
# rarely changes, and a page that is not the drop tables is refused unwritten.
droptables_url = "https://warframe-web-assets.nyc3.cdn.digitaloceanspaces.com/uploads/cms/hnfvc0o3jnfvc873njb03enrf56.html"

# Which Void Fissures are open right now. Digital Extremes publish the world
# state, but their documented endpoint answers 404 from here, so this reads
# warframestat.us, which parses that same world state into JSON.
#
# One request returns all three boards at once - ordinary, Steel Path
# (isHard) and Void Storms (isStorm) - which is why the page separates them:
# thirty-two fissures is not a number the game ever shows you.
#
# Their edge caches for two minutes, and so does the tool. Asking faster
# cannot produce a newer answer.
fissures_url = "https://api.warframestat.us/{platform}/fissures"

# When warframestat.us counts as behind: its board still lists a fissure that
# ended longer ago than this. A live board drops a fissure within a minute or
# two of its end (their edge cache holds two minutes); a board that still
# lists one an hour later is a poller that stopped, and whatever on it still
# runs is a remnant missing every fissure opened since. The game's own feed
# below is asked instead.
fissures_stale_after_minutes = 10

# Where the game itself publishes the world state (PC only). Asked when
# warframestat.us serves a board whose every fissure has already ended -
# its poller has been seen lagging for the better part of a day. Raw form:
# eras as VoidT4, missions as MT_SURVIVAL, nodes as SolNode717.
worldstate_url = "https://api.warframe.com/cdn/worldState.php"

# Names for those SolNode ids, from WFCD's community data project. Optional:
# without it the stand-in board shows raw node ids, which is uglier but no
# less true.
solnodes_url = "https://raw.githubusercontent.com/WFCD/warframe-worldstate-data/master/data/solNodes.json"

# Which platform's world state to read: pc, ps4, xb1 or swi.
platform = "pc"

# Digital Extremes' weekly riven trade data - real trades, not listings,
# aggregated per weapon and per rolled/unrolled, rewritten every Monday
# 00:00 UTC with the previous week's numbers. Only the current week is ever
# served, so the tool stores each week it sees and the history grows locally.
#
# One request a week is all the data can reward; the tool attempts one fetch
# per program run and no more. PC only - weeklyRivensPS4/XB1/SWI exist and
# are not this account's market.
riven_prices_url = "https://www-static.warframe.com/repos/weeklyRivensPC.json"

[fissures]
# Which mission types the Fissures page marks as quick (green in the Mission
# column): short runs, ten reactant and out. Void Storms never count. Set in
# Settings -> Fissures; names as the board spells them (Capture, Extermination,
# Mobile Defense, Void Flood ...).
quick_missions = ["Capture", "Extermination"]

[ranking]
# In what order the Rewards page weighs the options on a reward screen. Set in
# Settings -> Rewards; the first criterion that tells two options apart decides.
# Left out here on purpose: with no key the built-in order below applies, and
# "Reset to default" in Settings takes the keys out of your own file again.
#
# criteria = ["collection", "reach", "completes", "progress", "type",
#             "set_size", "relics", "rarity", "ducats"]
#   collection  a missing piece of a set whose mastery is not banked yet
#   reach       hard to get any other way
#   completes   finishes a set
#   progress    how far the set already is
#   type        the item type, by the numbers below
#   set_size    a smaller set
#   relics      fewer relics drop it
#   rarity      a rarer drop
#   ducats      more ducats
#
# A line below "collection" only tells options of its own kind apart (the
# farming questions only pieces you still need, ducats only options that add
# nothing to a set). A line above "collection" compares every option by its
# real value.
#
# One number per item type, 1 is first, equal numbers weigh the same:
# [ranking.types]
# warframe = 1
# archwing = 2
# companion = 3
# necramech = 4
# primary = 5
# secondary = 5
# melee = 5
# archgun = 5
# archmelee = 5
# companion_weapon = 5
# other = 5      # also what any type not listed here gets

[update]
# Remind me when the local data is older than this. 0 disables the reminder.
remind_after_days = 14

# With reference data already downloaded, the tool updates it by itself: the
# same steps as "Update now" on the Settings page (the game's manifest list,
# only what changed, the rebuild, the drop tables that decide which relics are
# vaulted), at most once in 24 hours, counted from the last run of any kind and
# from the last update however it was made (wf update counts too). If the tool
# was not running when one was due, it is made at the next start. A failed run
# is not repeated; the next one comes 24 hours later. Nothing is downloaded by
# itself before the first manual download on the Setup page. Every run is
# written to the database (the Settings page shows the last one). Set to false
# to update only with the buttons.
auto_fetch = true

[game]
# How the game window is recognised. Matched as a substring against both the
# window class and the title, case-insensitively.
#
# "warframe" rather than a class name on purpose: launched through Steam the
# window's class is the app id (steam_app_230410), not the executable, so a
# class-based default matched nothing. The title is "Warframe" either way.
# List what is actually there with: wf windows
window_class = "warframe"

# How many reward tiles the calibration assumes when it centres the row.
# Reading a reward screen does not depend on it: the count changes from one
# mission to the next, so every read tries 4, 3 and 2 tiles and keeps the
# one that recognises the most names.
reward_count = 4

[capture]
# Keep a picture of every reward screen the hotkey reads. Off by default.
#
# Why: to look back at what was on the screen, and as the material for
# measuring the reading regions. The name band is placed by fractions
# calibrated by eye and nothing checks that it still fits; a folder of real
# screens makes that measurable instead of arguable.
#
# What it costs: one JPEG per reading, about 1.3 MB at 4K, in one folder per
# day (<folder>/YYYY-MM-DD/HH:MM:SS:mmm.jpg). The pictures show the whole game
# window, including the names of your squad. They stay on your disk.
# Failures are ignored: the screen is only up for fifteen seconds and a
# picture is never worth the reading.
keep_rewards = false

# The folder for the pictures. Only used when keep_rewards is true.
keep_rewards_dir = "~/Pictures/warframe-rewards"

# At program start, the day folders older than this many days go to the
# trash. 0 means never. Only folders named like a date are touched.
keep_rewards_days = 30

[hotkey]
# evdev key name for the capture trigger, e.g. "F8", "PAUSE", "BACKSLASH", "KP1".
# Empty means not set up yet: the Setup page asks for a key and the Rewards page
# says it is not ready. Setup -> "Choose a key..." (or Settings -> Capture) fills
# this in by listening for the next key you press, and the running program uses
# it at once. The key only acts while the game window has focus, so it stays
# inert everywhere else.
key = ""

[display]
# Interface theme. One of: Orokin, Midnight, Blue Steel, Dark, Light.
# Orokin is taken from the game's own reward screens; Midnight and Blue Steel
# are carried over from the two earlier attempts. Changing it in Settings
# writes it back here.
theme = "Orokin"

# Base text size in points, 8 to 28. Worth raising on a 4K monitor.
font_size = 11

[notifications]
# Show the recommendation as a desktop notification after every reading of a
# reward screen (needs notify-send, package libnotify), so it can be seen
# without switching to this program. true or false. Settings -> Capture has a
# checkbox for it; a change applies at once.
enabled = true

[overlay]
# Draw the recommendation over the game's reward screen after a reading: a frame
# and TAKE THIS on the card to take, a few lines under every card. It needs the
# game as an X11 window (XWayland on a Wayland desktop) and ends with the reward
# screen. While it is shown the desktop notification above is not sent. true or
# false. The Overlays page has a checkbox for it; a change applies at once.
rewards = true
# While the reward overlay is up, read left clicks in the game window to see
# which card you click: a tick shows on it, the last card you click counts, and
# it is recorded as your pick when the overlay goes away (undo on the Rewards
# page). Only the position of the click is used; nothing is stored but the card
# and nothing is sent to the game. Needs the 'input' group like the hotkey. true
# or false. The Overlays page has a checkbox for it; a change applies at once.
click_to_pick = true
# The colours of the frame and the text of the overlay. "red-green" (red frame,
# green text), "blue-orange" (orange frame, sky-blue text; safe with red-green
# colour blindness), the name of an app theme ("Orokin", "Midnight", "Blue
# Steel", "Dark": its accent for the frame, its green for the text; a theme whose
# text reads badly on a light picture is not offered), or "custom" for the two
# colours below. The Overlays page has a list for it; a change applies the next
# time the overlay is drawn.
colours = "red-green"
# The colours for colours = "custom", as "#rrggbb". The Overlays page has fields
# and a colour dialog for them.
custom_frame = "#ff2a2a"
custom_text = "#3ddc6b"

[palette_grid]
# The look of the grid the Overlays page lays over the colour palette in the
# Arsenal. The Overlays page changes these and applies them at once.
columns = 5          # columns, named A, B, C ... from the left
rows = 18            # rows, numbered 1, 2, 3 ... from the top
cell_names = false   # also write each cell's name ("B7") into the cell
font_pt = 15         # size of the letters and numbers, in points
line_opacity = 0.55  # 0.05 (faint) to 1.0 (solid)


# --- Screen regions -----------------------------------------------------
# All values are fractions of the GAME WINDOW (0.0 to 1.0), never pixels and
# never desktop coordinates. That way they survive a resolution change, a move
# to another monitor, and a different monitor layout.
#
# The defaults were measured on 16:9 reward screens (one player, one interface
# scale). Override here only if the names come out wrong — a different aspect
# ratio, a non-default UI scale, or a game update that moved things. The Setup
# page ("First reward screen") and Settings -> "Calibrate reward regions..."
# measure them from a reward screen for you.
#
# A key set here replaces its built-in value, also an old one from an earlier
# calibration. Settings and `wf doctor` say when any is set, and the button
# "Use the measured values" in the calibration dialog removes them.

[regions.reward]
# The built-in values, from wft/relic/regions.py. Uncomment only to change one.
# tile_top       = 0.2065  # top edge of the reward tiles
# tile_height    = 0.219
# tile_width     = 0.125
# tile_gap       = 0.00122 # space between two tiles (not zero: they are not edge to edge)
# name_top       = 0.380   # the name text, spanning both possible lines
# name_height    = 0.050

# The row is centred, so only its centre, the tile width and the gap are
# configurable; any reward count follows from those. An older file may have
# tile_pitch (the distance from one tile to the next) instead of tile_gap; it
# still works, as long as there is no tile_gap beside it.
# row_centre_x  = 0.5


[profile]
# Your Warframe account id, so the tool can read which items you have ever
# levelled — including the ones you sold, which a scan of the inventory cannot
# see. This is a public profile lookup of the kind the game itself makes for
# "view profile": no login, no token, and nothing is read from the game.
#
# To find it once: log in at warframe.com, open the browser's cookie view for
# that site, select the cookie "user-info" and copy "user_id" from its value.
# Twenty-four characters of hex. The Import page explains the same steps.
account_id = ""

# With a valid account id the tool fetches that profile itself: one request,
# at most once in 24 hours, counted from the last request of any kind (the
# reload button on the Import page counts too). If the tool was not running when
# one was due, it is made at the next start. A failed request is not repeated;
# the next automatic one comes 24 hours later. Every request is written to the
# database (the Import page shows the last one), and the newest answer is kept
# as profile.json in the data folder. Without an id nothing is ever requested.
# Set to false to fetch only with the reload button, or never.
auto_fetch = true


[pictures]
# The item pictures come from Warframe's own content host, one request per
# picture, only for things you hold, each picture once. With this on, the tool
# fetches the missing ones by itself: right after an inventory import you
# applied, and otherwise at most once in 24 hours, counted from the last run of
# any kind (the reload button on the Import page counts too). Nothing is
# requested when no picture is missing. A picture the server does not have is
# skipped; any other failure ends the run, and for 24 hours the tool starts no
# run by itself, not even after an import. Every run is written to the database (the Import page shows the
# last one). Set to false to fetch only with the reload button.
auto_fetch = true


[trading]
# The pages "I want" and "I offer" (Trading in the navigation) write these when
# you change the field; nothing here needs editing by hand.
# What the message trades for, one value per list: "ducats" (parts of the same
# ducat value), "platinum" or "both". The message's title, terms and brackets
# follow it.
want_trade_for  = "ducats"
offer_trade_for = "ducats"
# "I want": show sets missing at most this many parts (1 to 20); 0 is no limit.
max_missing = 2
# "I offer": only parts whose cheapest seller asks at most this many platinum;
# 0 is no limit.
max_platinum = 0
