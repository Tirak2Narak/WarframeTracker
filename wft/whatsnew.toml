# What changed, newest first. This file is the one place the version number
# lives: the running version is the first entry (wft/version.py number()), and
# the "What's new" window shows all of them.
#
# version  "major.minor", compared as numbers (1.10 is newer than 1.9)
# date     YYYY-MM-DD of the archive; empty while the version is not shipped
# lines    1 to 6 very short lines

[[release]]
version = "1.5.1"
date = "2026-10-31"
lines = [
    "Reward card counts copies the whole set chain wants (owned 1/2)",
    "A notice when a newer release exists; Check for updates in Settings",
]

